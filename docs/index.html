<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Study Monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230e1116'/><circle cx='16' cy='16' r='8' fill='none' stroke='%234f9cf9' stroke-width='3'/><circle cx='16' cy='16' r='2.5' fill='%234f9cf9'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Smart Study Monitor</h1>
</header>

<main>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="overlay">
      <div id="status"></div>
      <button id="startBtn" disabled>Start</button>
    </div>
  </div>

  <div id="controls" hidden>
    <button id="stopBtn" class="secondary">Stop</button>

    <label class="ctl" title="Eye threshold - lower it if the sleep alarm is too eager">
      <input id="thr" type="range" min="5" max="20" step="0.5" value="11" aria-label="Eye threshold">
      <output id="thrOut">11</output>
    </label>

    <label class="ctl checkbox" title="Mute alarms">
      <input id="mute" type="checkbox" aria-label="Mute alarms">
    </label>

    <span id="fps" class="fps"></span>
  </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
